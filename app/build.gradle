plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sushil.swaralay'
    compileSdk 35

    defaultConfig {
        applicationId "com.sushil.swaralay"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
